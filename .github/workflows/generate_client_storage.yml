name: "Generate Client Storage"
on:
  push:
    branches:
      - master
    paths:
      - tgui/public/*

jobs:
  dispatch_repo:
    if: ( !contains(github.event.head_commit.message, '[ci skip]') )
    name: Repository Dispatch
    runs-on: ubuntu-24.04
    steps:
      - name: Generate App Token
        id: app-token-generation
        uses: actions/create-github-app-token@v3.2.0
        if: secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != ''
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Veilbreak-Frontier
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_ID: ${{ secrets.APP_ID }}

      - name: Send Repository Dispatch
        if: secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' && steps.app-token-generation.outcome == 'success'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token-generation.outputs.token }}
          repository: Veilbreak-Frontier/byond-client-storage
          event-type: on_master_push
