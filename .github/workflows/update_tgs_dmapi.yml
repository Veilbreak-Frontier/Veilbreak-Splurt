name: Update TGS DMAPI

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-dmapi:
    runs-on: ubuntu-24.04
    name: Update the TGS DMAPI
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate App Token
        id: app-token-generation
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # 1. We checkout USING the App Token so the pushed branch can trigger other CI checks
      - name: Clone
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token-generation.outputs.token }}
          fetch-depth: 0

      # 2. Corrected branch isolation logic
      - name: Branch
        run: |
          git checkout master
          git checkout -B tgs-dmapi-update

      - name: Apply DMAPI update
        uses: tgstation/tgs-dmapi-updater@v2
        id: dmapi-update
        with:
          header-path: "code/__DEFINES/tgs.dm"
          library-path: "code/modules/tgs"

      # 3. Only commit and push if there are actual code changes
      - name: Commit and Push
        id: git-push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes detected in TGS DMAPI."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m 'Update TGS DMAPI'
            git push -f -u origin tgs-dmapi-update
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 4. Modern, native PR creation that gracefully uses the GitHub App context
      - name: Create Pull Request
        if: steps.git-push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token-generation.outputs.token }}
        run: |
          gh pr create \
            --head "tgs-dmapi-update" \
            --base "master" \
            --title "Automatic TGS DMAPI Update" \
            --body "This pull request updates the TGS DMAPI to the latest version. Please note any changes that may be breaking or unimplemented in your codebase by checking what changes are in the definitions file: code/__DEFINES/tgs.dm before merging.

            ${{ steps.dmapi-update.outputs.release-notes }}" \
            --label "Tools" || echo "PR already exists or could not be created."
